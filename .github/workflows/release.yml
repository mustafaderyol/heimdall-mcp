name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Binary for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: heimdall
            artifact_name: heimdall-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: heimdall
            artifact_name: heimdall-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: heimdall
            artifact_name: heimdall-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: heimdall.exe
            artifact_name: heimdall-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
